<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMobileSoft</title>
<meta name="description" content="Color Sort Lab, a color sorting puzzle game for iPhone and iPad by Shahen Antonyan.">
<style>
  :root { --bg: #0f172a; --card: #1b2740; --text: #f1f5f9; --muted: #94a3b8; --accent: #3ddc97; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --accent: #0f9d63; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  .card { background: var(--card); border-radius: 16px; padding: 24px; }
  .card h2 { margin: 0 0 8px; font-size: 22px; }
  .card p { margin: 0 0 16px; }
  a { color: var(--accent); }
  ul { margin: 0; padding-left: 20px; }
  footer { color: var(--muted); font-size: 14px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>AMobileSoft</h1>
  <p class="lead">Mobile games by Shahen Antonyan.</p>
  <section class="card">
    <h2>Color Sort Lab</h2>
    <p>Pour, sort, mix new colors. A color sorting puzzle game for iPhone and iPad with hundreds of levels and a Daily Experiment every day.</p>
    <ul>
      <li><a href="https://amobilesoft.wordpress.com/color-sort-lab-privacy-policy/">Privacy Policy</a></li>
      <li>Support: <a href="mailto:shahenantonyan.ios@gmail.com">shahenantonyan.ios@gmail.com</a></li>
    </ul>
  </section>
  <footer>&copy; 2026 Shahen Antonyan</footer>
</main>
</body>
</html>
